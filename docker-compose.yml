# Vernissage – complete instance with Docker Compose.
#
# All values come from .env.local (generated by ./init.sh; .env is a symlink
# to it so that plain `docker compose` works without --env-file).
# Only the internal proxy on ${PROXY_BIND}:${PROXY_PORT} is exposed.

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-vernissage-server-env: &vernissage-server-env
  VERNISSAGE_BASEADDRESS: ${VERNISSAGE_BASEADDRESS:?run ./init.sh first}
  VERNISSAGE_CONNECTIONSTRING: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  VERNISSAGE_QUEUEURL: redis://default:${REDIS_PASSWORD}@redis:6379/0
  VERNISSAGE_S3ADDRESS: http://minio:9000
  VERNISSAGE_S3REGION: ""
  VERNISSAGE_S3BUCKET: ${S3_BUCKET}
  VERNISSAGE_S3ACCESSKEYID: ${MINIO_ROOT_USER}
  VERNISSAGE_S3SECRETACCESSKEY: ${MINIO_ROOT_PASSWORD}
  VERNISSAGE_S3HTTP1ONLYMODE: "false"
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  redis:
    image: redis:8.8.1-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # Pass the password via a config file rather than on the command line.
    command:
      - sh
      - -c
      - |
        umask 077
        printf 'appendonly yes\nappendfsync everysec\nrequirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  minio:
    build:
      context: ./docker/minio
    image: vernissage-local/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  # API without background jobs (also runs the database migrations on start-up).
  api:
    image: mczachurski/vernissage-server:${DOCKER_TAG:-latest}
    restart: unless-stopped
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *vernissage-server-env
      VERNISSAGE_DISABLEQUEUEJOBS: "true"
      VERNISSAGE_DISABLESCHEDULEDJOBS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 30s
    logging: *logging

  # Same image, but responsible for queues and scheduled jobs.
  jobs:
    image: mczachurski/vernissage-server:${DOCKER_TAG:-latest}
    restart: unless-stopped
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *vernissage-server-env
      VERNISSAGE_DISABLEQUEUEJOBS: "false"
      VERNISSAGE_DISABLESCHEDULEDJOBS: "false"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 30s
    logging: *logging

  web:
    image: mczachurski/vernissage-web:${DOCKER_TAG:-latest}
    restart: unless-stopped
    environment:
      VERNISSAGE_ALLOWED_HOSTS: ${VERNISSAGE_DOMAIN},*.${VERNISSAGE_DOMAIN}
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 20s
    logging: *logging

  push:
    image: mczachurski/vernissage-push:${DOCKER_TAG:-latest}
    restart: unless-stopped
    environment:
      VPUSH_KEY: ${VPUSH_KEY}
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 10s
    logging: *logging

  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    environment:
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-40M}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./docker/proxy/templates:/etc/nginx/templates:ro
    ports:
      - "${PROXY_BIND:-127.0.0.1}:${PROXY_PORT:-8180}:8080"
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
      minio:
        condition: service_healthy
    logging: *logging

  # Helper container for bucket set-up (only via `--profile tools`).
  s3-tools:
    image: amazon/aws-cli:2.36.2
    profiles: ["tools"]
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
    entrypoint: ["aws", "--endpoint-url", "http://minio:9000"]
    depends_on:
      minio:
        condition: service_healthy
